<meta name="description" content="Say a play out loud, or sketch it, and watch it draw itself in light. X's and O's for youth basketball and flag football coaches.">
<meta name="theme-color" content="#04070c">

<script type="importmap">{ "imports": { "aurora-field": "./vendor/aurora-field.mjs" } }</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { mount } from './src/index.js';
  const q = new URLSearchParams(location.search);
  window.chalk = mount(document.getElementById('app'), { fullscreen: true, sport: q.get('sport') || 'basketball', play: q.get('play') });
  // installable and offline (not on localhost, where it would cache the code under development)
  if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) navigator.serviceWorker.register('sw.js');
</script>
</body>
